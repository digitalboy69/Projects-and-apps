<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jyotish Notebook</title>
<style>
:root{
  --bg:#070a12;--bg2:#0c1120;--panel:#10172a;--panel2:#151e36;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --tx:#e8edf7;--tx2:#a9b6d0;--tx3:#6f7d99;--acc:#D4AF37;--acc2:#7B6EF6;--accT:#1a1405;--ok:#4ADE80;--bad:#FF6B6B;--warn:#FFB454;
  --paper:#0e1426;--sh:0 18px 50px rgba(0,0,0,.55);--r:14px;
  --serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs:16px;
}
[data-theme="parch"]{--bg:#efe6d2;--bg2:#e7dcc2;--panel:#f6efdd;--panel2:#fbf6e8;--line:rgba(60,40,10,.12);--line2:rgba(60,40,10,.22);--tx:#2c2113;--tx2:#5b4a31;--tx3:#8a7757;--paper:#fffaf0;--sh:0 18px 40px rgba(60,40,10,.25);--accT:#fff}
[data-theme="night"]{--bg:#000;--bg2:#050505;--panel:#0a0a0a;--panel2:#111;--paper:#050505;--line:rgba(255,255,255,.07)}
[data-acc="teal"]{--acc:#00D9C0;--acc2:#4F8BFF;--accT:#021412}
[data-acc="violet"]{--acc:#9D8CFF;--acc2:#FF7AC6;--accT:#0d0828}
[data-acc="rose"]{--acc:#FF7A9C;--acc2:#FFB454;--accT:#2b0610}
[data-acc="saffron"]{--acc:#FF9F43;--acc2:#FF5B5B;--accT:#261100}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.app{position:fixed;inset:0;display:grid;grid-template-columns:230px 330px 1fr;background:radial-gradient(60% 50% at 80% 0%,rgba(123,110,246,.10),transparent 60%),radial-gradient(50% 40% at 0% 100%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 60%),var(--bg)}
/* sidebar */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 88%,transparent);padding:14px 10px 10px;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand .lg{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accT);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.brand b{display:block;font:700 15px/1.1 var(--serif);letter-spacing:.02em}.brand small{font-size:10.5px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:12px;font-weight:700;font-size:14px;color:var(--accT);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 28%,transparent);transition:transform .15s,filter .15s}
.newbtn:hover{filter:brightness(1.08)}.newbtn:active{transform:scale(.97)}
.navs{flex:1;overflow:auto;margin-top:12px;min-height:0}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;color:var(--tx2);font-size:13.5px;text-align:left;transition:background .15s,color .15s}
.nv:hover{background:rgba(255,255,255,.05);color:var(--tx)}.nv.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);font-weight:600}
[data-theme="parch"] .nv:hover{background:rgba(60,40,10,.06)}
.nv .e{width:20px;text-align:center;font-size:15px}.nv .n{margin-left:auto;font-size:11px;color:var(--tx3);font-family:var(--mono)}.nv.on .n{color:var(--acc)}
.nh{display:flex;align-items:center;justify-content:space-between;margin:16px 10px 4px;font-size:10.5px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
.nh button{font-size:15px;color:var(--tx3);line-height:1;padding:2px 6px;border-radius:6px}.nh button:hover{color:var(--acc);background:rgba(255,255,255,.06)}
.sfoot{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;color:var(--tx2);transition:background .15s,color .15s}
.ib:hover{background:rgba(255,255,255,.08);color:var(--tx)}[data-theme="parch"] .ib:hover{background:rgba(60,40,10,.08)}
/* list column */
.lst{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.lh{padding:14px 14px 8px}
.lh h2{font:700 19px/1.2 var(--serif);display:flex;align-items:center;gap:8px}.lh h2 small{font:500 12px var(--sans);color:var(--tx3)}
.srch{position:relative;margin-top:10px}.srch input{width:100%;padding:10px 34px 10px 36px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}.srch i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6;font-size:14px}
.srch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 10px var(--mono);color:var(--tx3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.lc{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--tx2);background:transparent;transition:all .15s}
.chip:hover{border-color:var(--line2);color:var(--tx)}.chip.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc)}
.items{flex:1;overflow:auto;padding:6px 10px 20px;min-height:0}
.it{position:relative;display:block;width:100%;text-align:left;padding:11px 12px 11px 15px;border-radius:13px;margin-bottom:6px;border:1px solid transparent;background:transparent;transition:background .15s,border-color .15s,transform .15s;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.it:hover{background:rgba(255,255,255,.04)}[data-theme="parch"] .it:hover{background:rgba(60,40,10,.05)}
.it.on{background:var(--panel2);border-color:color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.it::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--cc,transparent)}
.it b{display:flex;gap:6px;align-items:center;font-size:14.5px;font-weight:650;line-height:1.3}.it b span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it p{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it mark,.mk{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.it .mt{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--tx3);flex-wrap:wrap}
.tg{padding:1px 8px;border-radius:99px;font-size:11px;background:color-mix(in srgb,var(--acc2) 16%,transparent);color:color-mix(in srgb,var(--acc2) 70%,var(--tx));border:1px solid color-mix(in srgb,var(--acc2) 28%,transparent)}
.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:13.5px;line-height:1.6}.empty .big{font-size:40px;margin-bottom:8px;opacity:.8}
/* editor column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:none;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ed-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.eh{padding:16px 28px 6px;max-width:900px;width:100%;margin:0 auto}
.ttl{width:100%;background:none;border:0;outline:none;font:700 30px/1.25 var(--serif);color:var(--tx);padding:2px 0}
.ttl::placeholder{color:var(--tx3)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px;font-size:12.5px;color:var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);font-size:12.5px;transition:border-color .15s}
.pill:hover{border-color:var(--line2)}.pill select,.pill input{background:none;border:0;outline:none;color:inherit;font-size:12.5px;max-width:130px}.pill select option{background:var(--panel);color:var(--tx)}
.pill input::placeholder{color:var(--tx3)}
.cdots{display:flex;gap:5px;align-items:center}.cd{width:16px;height:16px;border-radius:50%;border:2px solid transparent;background:var(--c);transition:transform .15s}.cd:hover{transform:scale(1.2)}.cd.on{border-color:var(--tx)}.cd.none{background:transparent;border:1px dashed var(--tx3)}
.tgin{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}.tgin .tg button{margin-left:4px;opacity:.6}.tgin .tg button:hover{opacity:1}
.client{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0 6px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 8%,transparent),color-mix(in srgb,var(--acc2) 6%,transparent))}
.client.on{display:grid}.client label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:3px}
.client input{width:100%;padding:7px 9px;border-radius:9px;background:var(--panel);border:1px solid var(--line);outline:none;font-size:13.5px;color-scheme:dark}[data-theme="parch"] .client input{color-scheme:light}
.client input:focus{border-color:var(--acc)}.client .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;grid-column:1/-1}
.tb{position:sticky;top:0;z-index:5;display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin:6px auto 0;max-width:900px;width:calc(100% - 40px);padding:5px 6px;border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tb button{min-width:32px;height:32px;padding:0 7px;border-radius:9px;font-size:14px;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:background .12s,color .12s}
.tb button:hover{background:rgba(255,255,255,.09);color:var(--tx)}[data-theme="parch"] .tb button:hover{background:rgba(60,40,10,.09)}
.tb button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}.tb .sp{width:1px;height:20px;background:var(--line2);margin:0 4px}
.tb .astro{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc2) 22%,transparent));color:var(--tx);font-weight:600;font-size:13px}
.scroll{flex:1;overflow:auto;min-height:0;padding:10px 20px 80px}
.paper{max-width:900px;margin:0 auto;padding:6px 8px}
#ed{outline:none;min-height:55vh;font-size:var(--fs);line-height:1.75;color:var(--tx);caret-color:var(--acc);word-break:break-word}
#ed:empty::before{content:attr(data-ph);color:var(--tx3)}
#ed h1{font:700 1.7em/1.3 var(--serif);margin:1em 0 .35em}#ed h2{font:700 1.38em/1.3 var(--serif);margin:1em 0 .3em;color:var(--acc)}#ed h3{font:700 1.12em/1.3 var(--sans);margin:.9em 0 .25em;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
#ed p,#ed div{margin:.25em 0}#ed ul,#ed ol{margin:.4em 0 .4em 1.4em}#ed li{margin:.15em 0}
#ed blockquote{margin:.8em 0;padding:.6em 1em;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 12px 12px 0;color:var(--tx2);font-style:italic}
#ed hr{border:0;height:1px;margin:1.2em 0;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.7}
#ed a{color:var(--acc2);text-decoration:underline;text-underline-offset:3px}#ed a.wl{color:var(--acc);text-decoration:none;border-bottom:1px dashed var(--acc);cursor:pointer;font-weight:600}
#ed table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:.94em}#ed td,#ed th{border:1px solid var(--line2);padding:7px 10px;min-width:60px;vertical-align:top}#ed th{background:color-mix(in srgb,var(--acc) 12%,transparent);text-align:left}
#ed ul.cl{list-style:none;margin-left:.2em}#ed ul.cl li{position:relative;padding-left:32px;min-height:1.6em}
#ed ul.cl li::before{content:"";position:absolute;left:4px;top:.32em;width:18px;height:18px;border-radius:6px;border:2px solid var(--tx3);background:transparent;cursor:pointer;transition:all .15s}
#ed ul.cl li.done::before{background:var(--acc);border-color:var(--acc)}#ed ul.cl li.done::after{content:"✓";position:absolute;left:8px;top:.28em;font-size:13px;font-weight:800;color:var(--accT);pointer-events:none}
#ed ul.cl li.done{color:var(--tx3);text-decoration:line-through}
#ed .gr{display:inline-block;padding:0 8px;border-radius:99px;font-size:.88em;font-weight:650;line-height:1.55;margin:0 1px;color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,transparent);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);white-space:nowrap}
#ed .sg{display:inline-block;padding:0 8px;border-radius:8px;font-size:.88em;font-weight:650;line-height:1.55;margin:0 1px;color:var(--tx);background:color-mix(in srgb,var(--acc2) 16%,transparent);border:1px solid color-mix(in srgb,var(--acc2) 38%,transparent);white-space:nowrap}
#ed .callout{margin:.8em 0;padding:.8em 1em;border-radius:14px;border:1px solid var(--cc);background:color-mix(in srgb,var(--cc) 11%,transparent)}
#ed .callout.c-warn{--cc:var(--warn)}#ed .callout.c-ok{--cc:var(--ok)}#ed .callout.c-info{--cc:var(--acc2)}#ed .callout.c-bad{--cc:var(--bad)}
#ed figure.chartfig{margin:1em auto;text-align:center;max-width:430px}#ed figure.chartfig svg{width:100%;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}#ed figure.chartfig figcaption{font-size:.85em;color:var(--tx3);margin-top:.4em}
#ed img{max-width:100%;border-radius:12px}
#ed .pbadge{display:inline-block;padding:0 8px;border-radius:99px;font-size:.8em;font-weight:700;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.ft{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3);background:color-mix(in srgb,var(--bg2) 90%,transparent)}
.ft .sv{margin-left:auto;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.w{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.bl{max-width:900px;margin:18px auto 0;padding:0 8px}.bl h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}.bl button{display:inline-block;margin:0 6px 6px 0;padding:4px 10px;border-radius:99px;font-size:12.5px;border:1px solid var(--line2);color:var(--acc)}
/* home */
.home{overflow:auto;flex:1;padding:26px 28px 60px}.hin{max-width:900px;margin:0 auto}
.hero{position:relative;border-radius:22px;padding:24px 24px 22px;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--panel)),color-mix(in srgb,var(--acc2) 14%,var(--panel)))}
.hero::after{content:attr(data-g);position:absolute;right:-8px;top:-30px;font-size:150px;opacity:.12;pointer-events:none}
.hero small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx2)}.hero h1{font:700 27px/1.25 var(--serif);margin:5px 0 8px}.hero p{color:var(--tx2);font-size:14px;line-height:1.55;max-width:560px}
.hero .sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero .sw span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.22);border:1px solid var(--line2)}[data-theme="parch"] .hero .sw span{background:rgba(255,255,255,.55)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.qb{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);transition:transform .18s,border-color .18s,box-shadow .18s}
.qb:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 12px 28px rgba(0,0,0,.3)}.qb .e{font-size:24px}.qb b{font-size:14px}.qb small{font-size:12px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}.st{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.st b{display:block;font:700 24px var(--serif);color:var(--acc)}.st small{font-size:11.5px;color:var(--tx3)}
.sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);margin:20px 2px 8px}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
/* tasks & predictions */
.panelv{flex:1;overflow:auto;padding:22px 28px 60px}.pin{max-width:900px;margin:0 auto}
.panelv h2{font:700 26px var(--serif);margin-bottom:4px}.panelv .sub{color:var(--tx3);font-size:13.5px;margin-bottom:16px}
.card{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease both}
.card .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--tx3);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--accT);margin-top:1px;transition:all .15s}
.card .ck.on{background:var(--acc);border-color:var(--acc)}.card .body{flex:1;min-width:0}.card .body b{font-size:14.5px;display:block;line-height:1.4}.card .body small{font-size:12px;color:var(--tx3)}
.card.dn b{text-decoration:line-through;color:var(--tx3)}
.bad{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid}.s-pending{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.s-hit{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}.s-partial{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 50%,transparent);background:color-mix(in srgb,var(--acc2) 12%,transparent)}
.s-miss{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.acc{display:flex;align-items:center;gap:18px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}.ring i{font:700 20px var(--serif);font-style:normal;width:68px;height:68px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
/* overlay / modal / palette */
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px}.ov.on{display:flex;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.md{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:20px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--sh);animation:pop .22s cubic-bezier(.2,.9,.3,1.15) both;overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.md header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.md header h3{font:700 18px var(--serif);flex:1}.md .bd{padding:16px 18px;overflow:auto;min-height:0}.md footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}

 {id:'consult',e:'🗣️',n:'Consultation Sheet',d:'Client, birth data, questions, findings, advice, follow-up',nb:'nb_clients',tags:['consultation'],client:true,h:()=>hd('Session details')+tbl(['Date','Mode','Duration','Fee'],[[new Date().toLocaleDateString(),'','','']])+hd('Client’s questions')+cl(['','',''])+hd('Chart snapshot')+tbl(['Lagna','Moon sign','Nakshatra','Mahadasha › Antardasha'],[['','','','']])+hd('Key observations')+'<ul><li><br></li></ul>'+hd('Timing (dasha + transit)')+p()+hd('Advice given')+p()+co('info','<b>Remedies suggested:</b> ')+hd('Follow-up')+cl(['Send summary to client','Review on '])},

 {id:'prashna',e:'❓',n:'Prashna (Horary)',d:'Question chart with time, place, omens and verdict',nb:'nb_clients',tags:['prashna'],h:()=>hd('The question')+p()+tbl(['Time of question','Place','Lagna','Moon'],[['','','','']])+hd('Significators')+cl(['Karaka of the matter:','Relevant house & lord:','Moon’s next aspect/conjunction:'])+hd('Omens & observations')+p()+hd('Verdict')+co('info','<b>Answer:</b> ')},

let savedRange=null;
function ed(){return $('#ed');}
function keepSel(){const s=getSelection();if(s.rangeCount&&ed()&&ed().contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange();}
document.addEventListener('selectionchange',keepSel);['keyup','mouseup','input','focusout'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('#ed'))keepSel();},true));
function restoreSel(){const e=ed();if(!e)return;{const s0=getSelection();if(document.activeElement===e&&s0.rangeCount&&e.contains(s0.anchorNode))return;}e.focus();if(savedRange&&!e.contains(savedRange.startContainer))savedRange=null;if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange);}else{const r=document.createRange();r.selectNodeContents(e);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}}
function ins(html){restoreSel();const sl=getSelection();if(!sl.rangeCount){document.execCommand('insertHTML',false,html);changed();return;}
 const r=sl.getRangeAt(0);r.deleteContents();const t=document.createElement('template');t.innerHTML=html;const fr=t.content,last=fr.lastChild;r.insertNode(fr);if(last){const n=document.createRange();n.setStartAfter(last);n.collapse(true);sl.removeAllRanges();sl.addRange(n);}savedRange=sl.rangeCount?sl.getRangeAt(0).cloneRange():null;changed();}
function changed(){const n=ui.sel&&N(ui.sel);if(!n||!ed())return;n.html=ed().innerHTML;n.updated=Date.now();snap(n);persist();stats();const it=$(`.it[data-id="${n.id}"]`);if(it){const pr=txt(n.html).slice(0,140);it.querySelector('p').textContent=pr||'No content yet';}}
function insBlock(html){restoreSel();const e=ed(),sl=getSelection();if(sl.rangeCount){let n=sl.anchorNode;while(n&&n.parentNode&&n.parentNode!==e)n=n.parentNode;if(n&&n.parentNode===e){const r=document.createRange();r.setStartAfter(n);r.collapse(true);sl.removeAllRanges();sl.addRange(r);}}document.execCommand('insertHTML',false,html);changed();}
function exec(c,v){restoreSel();document.execCommand(c,false,v||null);changed();}
function block(t){restoreSel();document.execCommand('formatBlock',false,t==='p'?'p':t);changed();}
function addChecklist(){restoreSel();const s=getSelection();let li=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);li=li&&li.closest('ul.cl');if(li){document.execCommand('insertUnorderedList');}else{document.execCommand('insertHTML',false,'<ul class="cl"><li><br></li></ul>');}changed();}

 const cd=T.closest('[data-col]');if(cd){const n=N(ui.sel);n.color=cd.dataset.col;persist();$$('.cd').forEach(x=>x.classList.toggle('on',x.dataset.col===n.color));renderList();return;}
 const tp=T.closest('[data-tpl]');if(tp){useTpl(tp.dataset.tpl);return;}
 const cc=T.closest('[data-c]');if(cc){exec(cc.dataset.c);return;}
 const bb=T.closest('[data-b]');if(bb){block(bb.dataset.b);return;}
 const ib=T.closest('[data-ins]');if(ib){ins(ib.dataset.ins.replace(/&#39;/g,"'"));return;}
 const pt=T.closest('[data-pt]');if(pt){ui.palTab=+pt.dataset.pt;const el=$('#pal');el.classList.remove('on');palette();return;}
 const ci=T.closest('[data-ci]');if(ci){cmdGo(+ci.dataset.ci);return;}
 if(T.id==='ov'){closeModal();return;}if(T.id==='ovc'){closeModal();return;}
 if(!T.closest('#pal')&&!T.closest('[data-a="pal"]')&&$('#pal').classList.contains('on'))$('#pal').classList.remove('on');
 if(!act)return;
 const n=ui.sel&&N(ui.sel);
 switch(act){
 case'new':doNew();break;case'tpl':tplModal();break;case'client':newClient();break;case'addpred':predModal();break;
 case'close':closeModal();break;
 case'sort':ui.sort=ui.sort==='updated'?'created':ui.sort==='created'?'title':'updated';renderList();break;
 case'addnb':{modal('New notebook',`<label class="fld"><span>Name</span><input id="nbn" maxlength="30" placeholder="e.g. Marriage cases"></label><div class="fld"><span>Icon</span><div class="lc" id="nbi">${ICO.map((c,i)=>`<button class="chip${i===0?' on':''}" data-ic="${c}" style="font-size:18px">${c}</button>`).join('')}</div></div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn p" data-a="mknb">Create</button>`);break;}
 case'mknb':{const nm=$('#nbn').value.trim();if(!nm)return toast('Give it a name');const ic=($('#nbi .on')||{dataset:{ic:'📒'}}).dataset.ic;const b={id:'nb_'+uid(),name:nm,ic};S.nbs.push(b);persist();closeModal();go('nb:'+b.id);break;}
 case'pin':n.pin=!n.pin;persist();editorHTML(n);renderList();renderNav();break;
 case'clientT':if(n.client){n.client.open=!n.client.open;$('#client').classList.toggle('on',n.client.open);}else{n.client={name:'',dob:'',tob:'',pob:'',open:true};persist();editorHTML(n);}persist();break;
 case'rmclient':if(confirm('Remove the client card from this note?')){n.client=null;persist();editorHTML(n);renderList();}break;
 case'openchart':try{parent.postMessage('vedic-open-chart','*');}catch(_){}toast('Open the Birth Chart and enter: '+[n.client.name,n.client.dob,n.client.tob,n.client.pob,n.client.lat!=null&&n.client.lat!==''?'('+(+n.client.lat).toFixed(3)+', '+(+n.client.lon).toFixed(3)+')':''].filter(Boolean).join(' · '));break;
 case'insclient':{const c=n.client;insBlock(`<div class="callout c-info"><b>👤 ${esc(c.name||'Client')}</b><br>Born: ${esc(c.dob||'—')} at ${esc(c.tob||'—')} · ${esc(c.pob||'—')}${c.lat!=null&&c.lat!==''?' ('+(+c.lat).toFixed(4)+'°, '+(+c.lon).toFixed(4)+'°)':''}</div><p><br></p>`);break;}
 case'pickmap':case'pickco':{const LPk=(window.parent&&window.parent!==window)?window.parent.LocPicker:null;if(!LPk){toast('The map picker works inside the full app');break;}LPk.open({mode:act==='pickco'?'coords':'map',lat:n.client.lat,lon:n.client.lon,name:n.client.pob,title:'Place of birth',onPick:r=>{n.client.pob=r.display_name;n.client.lat=parseFloat(r.lat);n.client.lon=parseFloat(r.lon);n.updated=Date.now();persist();const c=$('#client');if(c)c.innerHTML=clientHTML(n.client);toast('Place saved');}});break;}
 case'check':addChecklist();break;
 case'hilite':{keepSel();const cs=['#FFD16666','#4ADE8066','#FF7AC666','#4F8BFF66','#FF5B5B66'];modalMini(a,cs.map(c=>`<button class="cd" style="--c:${c.slice(0,7)}" data-hc="${c}"></button>`).join('')+'<button class="cd none" data-hc="transparent" title="None"></button>');break;}
 case'color':{keepSel();const cs=['#FFD166','#FF9F43','#FF5B5B','#FF8CC6','#9D8CFF','#4F8BFF','#00D9C0','#4ADE80','#C9D6F2'];modalMini(a,cs.map(c=>`<button class="cd" style="--c:${c}" data-tc="${c}"></button>`).join(''));break;}
 case'table':modal('Insert table',`<div class="g2"><label class="fld"><span>Rows</span><input type="number" id="tr" value="4" min="1" max="30"></label><label class="fld"><span>Columns</span><input type="number" id="tc" value="3" min="1" max="10"></label></div><label class="fld"><span><input type="checkbox" id="th" checked style="width:auto"> First row is a header</span></label>`,`<button class="btn" data-a="close">Cancel</button><button class="btn p" data-a="mktable">Insert</button>`);break;
 case'mktable':{const r=Math.min(30,+$('#tr').value||3),c=Math.min(10,+$('#tc').value||3),h=$('#th').checked;let s='<table>';for(let i=0;i<r;i++){s+='<tr>';for(let j=0;j<c;j++)s+=(i===0&&h?'<th><br></th>':'<td><br></td>');s+='</tr>';}closeModal();insBlock(s+'</table><p><br></p>');break;}
 case'callout':modal('Insert callout',`<div class="tpl" style="grid-template-columns:1fr 1fr">${[['info','💡','Insight'],['ok','✅','Good sign'],['warn','⚠️','Caution'],['bad','⛔','Warning']].map(c=>`<button data-ct="${c[0]}"><span class="e">${c[1]}</span><b>${c[2]}</b></button>`).join('')}</div>`);break;
 case'link':{keepSel();const u=prompt('Link address (https://…)');if(u){restoreSel();document.execCommand('createLink',false,/^https?:|^mailto:/.test(u)?u:'https://'+u);changed();}break;}
 case'wiki':{keepSel();const L=live().filter(x=>x.id!==ui.sel);modal('📎 Link to a note',L.length?`<input class="ttl" id="wq" placeholder="Search notes…" style="font-size:16px;margin-bottom:8px;border-bottom:1px solid var(--line)"><div id="wl">${L.slice(0,40).map(x=>`<button class="nv" data-wk="${x.id}"><span class="e">🗒️</span>${esc(x.title||'Untitled')}</button>`).join('')}</div>`:'<div class="empty">Create another note first, then link them.</div>');break;}
 case'pal':palette();break;case'chart':chartModal();break;
 case'doChart':{const st=$('#cs').value,l=+$('#cl').value,pl={};$$('#cin2 input').forEach(i=>pl[i.dataset.k]=i.value);const ti=$('#ct').value.trim();const svg=chartSVG(st,l,pl,ti);closeModal();insBlock(`<figure class="chartfig" contenteditable="false">${svg}<figcaption>${esc(ti||(st==='n'?'North Indian chart':'South Indian chart'))}</figcaption></figure><p><br></p>`);break;}
 case'pred':{const s=getSelection().toString().trim()||(savedRange?savedRange.toString().trim():'');predModal(null,s);break;}
 case'savepred':{const tx=$('#pt').value.trim();if(!tx)return toast('Write the prediction first');const id=a.dataset.pid,o={text:tx,client:$('#pc').value.trim(),target:$('#pd').value,st:$('#ps').value,out:$('#po').value.trim()};if(id){Object.assign(S.preds.find(x=>x.id===id),o);}else S.preds.unshift(Object.assign({id:uid(),made:todayISO(),nid:a.dataset.nid||''},o));persist();closeModal();renderNav();if(ui.view==='pred')renderMain();toast('Prediction saved');break;}
 case'editpred':{const x=S.preds.find(y=>y.id===a.closest('[data-pid]').dataset.pid);predModal(x);break;}
 case'delpred':if(confirm('Delete this prediction?')){S.preds=S.preds.filter(x=>x.id!==a.dataset.pid);persist();closeModal();renderNav();renderMain();}break;
 case'tk':{const c=a.closest('.card'),nt=N(c.dataset.tn),d=document.createElement('div');d.innerHTML=nt.html;const li=d.querySelectorAll('ul.cl li')[+c.dataset.ti];if(li){li.classList.toggle('done');nt.html=d.innerHTML;nt.updated=Date.now();persist();renderNav();renderMain();}break;}
 case'mic':mic();break;
 case'more':moreModal();break;
 case'hist':histModal();break;
 case'restver':{const v=n.ver[+a.dataset.i];n.ver.unshift({t:Date.now(),h:n.html,ti:n.title});n.html=v.h;n.title=v.ti;n.updated=Date.now();persist();closeModal();editorHTML(n);renderList();toast('Version restored');break;}
 case'dup':{const c=newNote({title:(n.title||'Untitled')+' (copy)',html:n.html,nb:n.nb,tags:n.tags.slice(),client:!!n.client});if(n.client)c.client=Object.assign({},n.client);closeModal();openNote(c.id);toast('Duplicated');break;}
 case'exp':{const t=a.dataset.t,nm=(n.title||'note').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'note';if(t==='md')dl(nm+'.md','# '+(n.title||'Untitled')+'\n\n'+toMD(n.html),'text/markdown');else if(t==='txt')dl(nm+'.txt',(n.title||'Untitled')+'\n\n'+ed().innerText);else dl(nm+'.html',`<!doctype html><meta charset="utf-8"><title>${esc(n.title)}</title><body style="font:16px/1.7 Georgia,serif;max-width:760px;margin:30px auto;padding:0 16px;color:#222"><h1>${esc(n.title)}</h1>${n.html}</body>`,'text/html');closeModal();break;}
 case'print':closeModal();setTimeout(()=>window.print(),120);break;
 case'copy':try{navigator.clipboard.writeText((n.title?n.title+'\n\n':'')+ed().innerText);toast('Copied');}catch(_){toast('Copy blocked by browser');}closeModal();break;
 case'focus':closeModal();document.body.classList.toggle('focus');break;
 case'trash':n.trash=true;n.updated=Date.now();persist();closeModal();ui.sel=null;$('#app').classList.remove('edit');render();toast('Moved to Trash');break;
 case'restore':n.trash=false;persist();render();toast('Restored');break;
 case'purge':if(confirm('Delete this note forever? This cannot be undone.')){S.notes=S.notes.filter(x=>x.id!==n.id);ui.sel=null;persist();$('#app').classList.remove('edit');render();}break;
 case'backup':dl('jyotish-notebook-backup-'+todayISO()+'.json',JSON.stringify(S),'application/json');toast('Backup downloaded');break;
 case'restore2':$('#rf').click();break;
 case'setpin':{const v=$('#pin1').value;if(!/^\d{4,8}$/.test(v))return toast('PIN must be 4–8 digits');sha(v).then(h=>{S.set.pin=h;persist();toast('PIN saved');setModal();});break;}
 case'clrpin':S.set.pin=null;persist();toast('PIN removed');setModal();break;
 }
});
function modalMini(btn,html){const o=$('#minip');if(o)o.remove();const d=document.createElement('div');d.id='minip';d.className='tb';d.style.cssText='position:fixed;z-index:70;width:auto;padding:8px;gap:6px;margin:0';const r=btn.getBoundingClientRect();d.style.left=Math.min(r.left,innerWidth-260)+'px';d.style.top=r.bottom+6+'px';d.innerHTML=html;document.body.appendChild(d);setTimeout(()=>document.addEventListener('click',function f(ev){if(!d.contains(ev.target)||ev.target.closest('[data-hc],[data-tc]')){d.remove();document.removeEventListener('click',f,true);}},true),0);}
document.addEventListener('click',e=>{const h=e.target.closest('[data-hc]'),t=e.target.closest('[data-tc]'),c=e.target.closest('[data-ct]'),w=e.target.closest('[data-wk]');
 if(h){e.stopPropagation();restoreSel();document.execCommand('hiliteColor',false,h.dataset.hc);changed();}
 if(t){e.stopPropagation();restoreSel();document.execCommand('foreColor',false,t.dataset.tc);changed();}
 if(c){const k=c.dataset.ct,ic={info:'💡',ok:'✅',warn:'⚠️',bad:'⛔'}[k];closeModal();insBlock(`<div class="callout c-${k}"><b>${ic} </b>&nbsp;</div><p><br></p>`);}
 if(w){const x=N(w.dataset.wk);closeModal();ins(`<a class="wl" data-note="${x.id}" contenteditable="false">${esc(x.title||'Untitled')}</a>&nbsp;`);}},true);
document.addEventListener('input',e=>{if(e.target.id==='wq'){const q=e.target.value.toLowerCase();$$('#wl button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none');}});
$('#bNew').onclick=doNew;$('#bNew2').onclick=doNew;$('#bTpl').onclick=tplModal;$('#bSet').onclick=setModal;$('#bCmd').onclick=cmdOpen;$('#bLock').onclick=lockNow;
$('#bMenu').onclick=()=>$('#app').classList.toggle('sidev');$('#bBack').onclick=()=>{$('#app').classList.remove('edit');};
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';ui.q='';renderList();e.target.blur();}else if(e.key==='Enter'){const f=$('#items .it');if(f)f.click();}});
async function tryUnlock(){const v=$('#lpin').value;if(!v)return;const h=await sha(v);if(h===S.set.pin){$('#lock').classList.remove('on');}else{$('#lerr').textContent='Wrong PIN';$('#lpin').value='';}}
$('#lpin').addEventListener('input',e=>{if(e.target.value.length>=4&&e.target.value.length<=8){clearTimeout(e.target._t);e.target._t=setTimeout(tryUnlock,350);}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}});
/* ---------- first run ---------- */
function welcome(){const t=Date.now();const w=newNote({title:'Welcome to your Jyotish Notebook 🪔',nb:'nb_study',tags:['welcome'],html:
 hd('Everything an astrologer writes, in one place')+p('This is a private notebook that lives in your browser. Nothing is uploaded anywhere.')+hd('Try these')+cl(['Press <b>🪐 Astro</b> and insert a planet like <span class="gr" style="--gc:#FF9F43">☉ Sun</span> or a sign like <span class="sg">♌ Leo</span>','Press <b>🔯 Chart</b> to draw a North or South Indian chart right inside a note','Open <b>🗂️ Templates</b> to start a Consultation Sheet, Prashna, Muhurta plan or Remedy plan','Select a sentence and press 🎯 to log it as a <b>prediction</b>, then review it later to see your accuracy','Tick this item — then look at the ✅ Tasks page'])+co('info','<b>Tip:</b> type <b># </b> for a heading, <b>- </b> for bullets, <b>[] </b> for a checklist. Press <b>Ctrl+K</b> for the command palette.')+hd('Back up often')+p('Open ⚙️ Settings → Download backup. Keep that file safe: it is your whole notebook.')});
 w.updated=t;S.set.welcomed=true;persist();}
S=load();applyTheme();if(!S.notes.length&&!S.set.welcomed)welcome();
if(S.set.pin)lockNow();
$('#app').classList.add('edit');render();
window.__np={S:()=>S,ui,TPL,sr:()=>savedRange&&[savedRange.startContainer.nodeName,savedRange.startOffset,savedRange.startContainer.textContent]};
})();
</script>
