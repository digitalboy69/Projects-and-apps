<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#12100d">
<title>Your purchase</title>
<style>
:root{--bg:#12100d;--card:#1b1814;--card2:#26211a;--line:#3a332a;--fg:#f1ebdf;--muted:#aaa190;--gold:#d4a24a;--gold2:#f0c46a;--ink:#1a1405;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 400px at 50% -100px,rgba(212,162,74,.18),transparent 70%),var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:start center;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
.wrap{width:100%;max-width:460px;margin-top:6vh}
.card{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:24px 20px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 8px}
.desc{color:var(--fg);margin:12px 0;white-space:pre-line}.msg{color:var(--muted);margin:10px 0 0;font-size:14px}
.btn{display:block;margin-top:18px;min-height:52px;line-height:52px;text-align:center;border-radius:14px;background:var(--gold);color:var(--ink);font-weight:600;text-decoration:none}
</style></head>
<body><div class="wrap"><div class="card" id="card"><p class="msg">Loading…</p></div></div>
<script src="config.js"></script>
<script>
(function(){
var C=window.PAYHUB,card=document.getElementById('card');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var q=new URLSearchParams(location.search),o=q.get('o')||'',p=q.get('p')||'';
if(!o||!p){card.innerHTML='<h1>Link incomplete</h1><p class="msg">Please open the full link you were given after paying.</p>';return}
fetch(C.supabaseUrl+'/functions/v1/ph-receipt',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey},body:JSON.stringify({order_id:o,payment_id:p})})
.then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
.then(function(x){
  if(!x.ok){card.innerHTML='<h1>Not found</h1><p class="msg">We could not find a paid purchase for this link. If you just paid, wait a minute and refresh. Otherwise contact the seller with your Payment ID.</p>';return}
  var j=x.j;
  card.innerHTML='<h1>'+esc(j.title)+'</h1><p class="msg">Paid &#8377;'+(j.amount_paise/100).toLocaleString('en-IN')+' &middot; Payment ID: '+esc(p)+'</p>'+
    '<p class="desc">'+esc(j.delivery_message||j.success_message)+'</p>'+
    (j.delivery_url&&/^https:\/\//.test(j.delivery_url)?'<a class="btn" href="'+esc(j.delivery_url)+'" target="_blank" rel="noopener noreferrer">Open your purchase</a>':'')
}).catch(function(){card.innerHTML='<p class="msg">Could not load. Check your internet and try again.</p>'})
})();
</script></body></html>
