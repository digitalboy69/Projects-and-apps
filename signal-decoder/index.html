@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{padding-top:env(safe-area-inset-top,0px)}

    h=dots()+'<h2>What does it feel like?</h2><p class="sub">Pick any that fit. Each one has a plain explanation.</p><div class="chips">'+Object.keys(S).map(function(k){return chip('s',k,S[k])}).join('')+'</div>'+nav()
  }else if(st.step===2){
    h=dots()+'<h2>What is going on around it?</h2><p class="sub">Whatever was true just before it started.</p><div class="chips">'+Object.keys(C).map(function(k){return chip('c',k,C[k],k==='nothing'?'wide':'')}).join('')+'</div>'+nav()
  }else if(st.step===3){
    var W=['A little','Mild','Medium','Strong','Very strong'];
    h=dots()+'<h2>How strong is it?</h2><p class="sub">There is no right answer.</p><div class="scale">'+[1,2,3,4,5].map(function(n){return '<button class="chip" data-t="i" data-k="'+n+'" id="c-i-'+n+'" aria-pressed="'+(st.i===n)+'"><b>'+n+'</b><span>'+W[n-1]+'</span></button>'}).join('')+'</div>'+nav()
  }else{
    h=dots();
    if(st.done){
      h+='<div class="done"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M16 28l8 8 14-17" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Saved as "'+ename(st.saved)+'"</h3><p>Next time, similar signals will lean toward this. Nice work noticing it.</p><button class="btn" data-a="again" id="again">Check in again</button></div>'
    }else{
      var picked=feats(st).map(function(f){return '<span>'+lab(f)+'</span>'}).join('');
      var r=score(),top=r[0].sc;
      h+='<h2>What it might be</h2>'+(picked?'<div class="picked">'+picked+'</div>':'');
      if(!picked){h+='<p class="empty">You did not pick anything, and that is okay. Go back and add anything you notice, or choose a feeling yourself below.</p>'}
      else if(top<2){h+='<p class="empty">Not enough to guess yet. Go back and add one more thing, or choose a feeling yourself below.</p>'}
      else{
        var show=r.filter(function(x){return x.sc>=2&&x.sc>=top*.55}).slice(0,3);
        h+=show.map(function(x){var strong=x.sc>=top*.85;
          return '<div class="guess"><div class="gh"><span class="gn">'+x.e.n+'</span><span class="tag'+(strong?'':' dim')+'">'+(strong?'Fits well':'Could be')+'</span></div><p>'+x.e.m+'</p><p class="try"><b>A small thing to try</b>'+x.e.t+'</p><p class="why">Because of: '+x.why.join(', ')+(x.learnt?' and your past check-ins':'')+'</p><button class="btn" data-a="fit" data-e="'+x.e.id+'" id="fit-'+x.e.id+'">This fits</button></div>'
        }).join('')
      }
      h+='<details><summary>None of these fit? Choose any feeling</summary><div class="chips">'+E.map(function(e){return '<button class="chip" data-a="fit" data-e="'+e.id+'" id="all-'+e.id+'"><b>'+e.n+'</b></button>'}).join('')+'</div></details>'+
      '<div class="nav"><button class="btn ghost" data-a="back" id="back">Back</button><button class="btn ghost" data-a="again" id="again">Start over</button></div>'
    }
  }
  $('stage').innerHTML='<div class="card">'+h+'</div>'
}
function renderGuide(){
  $('pgGuide').innerHTML='<h2>Feelings guide</h2><p class="sub">What each feeling means in simple words, and how it often shows up in the body.</p>'+E.map(function(e){
    var z=Object.keys(e.z).map(function(k){return Z[k].l}),s=Object.keys(e.s).map(function(k){return S[k].l+' ('+S[k].d.toLowerCase()+')'});
    return '<details class="gcard"><summary>'+e.n+'</summary><div class="in"><p>'+e.m+'</p><p><b>Often felt in:</b> '+z.join(', ')+'</p><p><b>It may feel like:</b> '+s.join('; ')+'</p><p class="try" style="background:var(--soft);border-radius:12px;padding:10px 12px"><b>A small thing to try:</b> '+e.t+'</p></div></details>'
  }).join('')
}
function renderCalm(){
  $('pgCalm').innerHTML='<h2>Calm down</h2><p class="sub">Slow breathing tells your body it is safe. Breathe in for 4, out for 6.</p><div class="card"><div class="breath"><div class="orb" id="orb">Ready</div></div><div class="row" style="justify-content:center"><button class="btn small" id="breathBtn">Start</button></div></div>'+
  '<div class="card" style="margin-top:14px"><h2 style="font-size:20px">If your mind is racing</h2><p class="sub" style="margin-bottom:10px">Look around and name:</p><ol class="steps"><li>5 things you can see</li><li>4 things you can touch</li><li>3 things you can hear</li><li>2 things you can smell</li><li>1 thing you can taste</li></ol></div>';
  $('breathBtn').onclick=toggleBreath
}
function toggleBreath(){
  var orb=$('orb'),b=$('breathBtn');
  if(breathT){clearInterval(breathT);breathT=null;orb.className='orb';orb.textContent='Ready';b.textContent='Start';return}
  var n=0;b.textContent='Stop';
  function tick(){var p=n%10;if(p===0){orb.className='orb in'}if(p===4){orb.className='orb out'}orb.textContent=p<4?'Breathe in':'Breathe out';n++}
  tick();breathT=setInterval(tick,1000)
}
function renderMine(){
  var h='<h2>My patterns</h2><p class="sub">Built only from check-ins you confirmed.</p><div class="card">';
  if(!log.length){h+='<p class="empty">Nothing yet. After you press "This fits" on a guess, patterns appear here.</p></div>'}
  else{
    var map={},cnt={};
    log.forEach(function(e){cnt[e.emo]=(cnt[e.emo]||0)+1;e.c.forEach(function(c){map[c]=map[c]||{n:0,e:{}};map[c].n++;map[c].e[e.emo]=(map[c].e[e.emo]||0)+1})});
    var lines=[];Object.keys(map).forEach(function(c){if(map[c].n<2||!C[c])return;var best=null;Object.keys(map[c].e).forEach(function(k){if(!best||map[c].e[k]>map[c].e[best])best=k});lines.push('<p class="pat">When <b>'+C[c].l.toLowerCase()+'</b>, you most often chose <b>'+ename(best)+'</b> ('+map[c].e[best]+' of '+map[c].n+' times).</p>')});
    var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,3);
    h+=(lines.length?lines.join(''):'<p class="empty">Add a few more check-ins with the same "around it" answer to see links.</p>')+'<p class="why">Most common so far: '+ks.map(function(k){return ename(k)+' ('+cnt[k]+')'}).join(', ')+'</p></div>'+
    '<div class="card" style="margin-top:14px"><h2 style="font-size:20px">Recent check-ins</h2><ul class="log">'+log.slice(0,12).map(function(e){return '<li><span class="t">'+new Date(e.t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · strength '+e.i+' of 5</span><span class="e">'+ename(e.emo)+'</span><span class="why">'+feats(e).map(lab).filter(Boolean).join(', ')+'</span></li>'}).join('')+'</ul></div>'
  }
  h+='<div class="card" style="margin-top:14px"><h2 style="font-size:20px">Your data</h2><p class="sub" style="margin-bottom:0">Save a copy to keep it safe or share it with a therapist.</p><div class="row"><button class="btn small" id="expBtn">Show my data</button><button class="btn small ghost" id="impBtn">Import data</button><button class="btn small ghost" id="clrBtn">Delete all</button></div><textarea id="dataArea" hidden aria-label="Your data"></textarea><div class="row" id="impRow" hidden><button class="btn small" id="impGo">Add to my list</button></div><p class="why" id="msg" role="status"></p><p class="why" id="clrAsk" hidden>This deletes every saved check-in on this device. <button class="btn small ghost" id="clrYes">Yes, delete</button> <button class="btn small ghost" id="clrNo">Keep them</button></p></div>';
  $('pgMine').innerHTML=h;
  $('expBtn').onclick=function(){var ta=$('dataArea');ta.hidden=false;$('impRow').hidden=true;ta.readOnly=true;ta.value=JSON.stringify(log);ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){$('msg').textContent='Copied. You can paste it anywhere safe.'},function(){$('msg').textContent='Select the text and copy it.'})}catch(e){$('msg').textContent='Select the text and copy it.'}};
  $('impBtn').onclick=function(){var ta=$('dataArea');ta.hidden=false;ta.readOnly=false;ta.value='';ta.placeholder='Paste your saved data here';$('impRow').hidden=false;$('msg').textContent=''};
  $('impGo').onclick=function(){try{var a=JSON.parse($('dataArea').value),ok=0;if(!Array.isArray(a))throw 0;a.forEach(function(e){if(e&&Array.isArray(e.z)&&Array.isArray(e.s)&&Array.isArray(e.c)&&typeof e.t==='number'&&E.some(function(x){return x.id===e.emo})){if(!log.some(function(l){return l.t===e.t}))log.push({t:e.t,z:e.z,s:e.s,c:e.c,i:+e.i||3,emo:e.emo}),ok++}});log.sort(function(a,b){return b.t-a.t});save();renderMine();$('msg').textContent='Added '+ok+' check-ins.'}catch(x){$('msg').textContent='That did not look like saved data. Nothing was changed.'}};
  $('clrBtn').onclick=function(){$('clrAsk').hidden=false};$('clrNo').onclick=function(){$('clrAsk').hidden=true};
  $('clrYes').onclick=function(){log=[];save();renderMine()}
}
function renderNav(){
  $('tabbar').innerHTML=NAV.map(function(n){return '<button id="tab-'+n.id+'" data-tab="'+n.id+'" aria-pressed="'+(st.tab===n.id)+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+n.i+'</svg>'+n.l+'</button>'}).join('')
}
function show(tab){
  if(breathT&&tab!=='calm')toggleBreath();
  st.tab=tab;
  $('stage').hidden=tab!=='check';$('pgGuide').hidden=tab!=='guide';$('pgCalm').hidden=tab!=='calm';$('pgMine').hidden=tab!=='mine';
  if(tab==='check')renderCheck();if(tab==='guide')renderGuide();if(tab==='calm')renderCalm();if(tab==='mine')renderMine();
  renderNav();window.scrollTo(0,0)
}
function toggle(t,k){
  if(t==='i'){st.i=+k;renderCheck();return}
  var a=st[t],i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);renderCheck()
}
function fit(id){
  log.unshift({t:Date.now(),z:st.z.slice(),s:st.s.slice(),c:st.c.slice(),i:st.i,emo:id});
  if(log.length>300)log.length=300;save();st.done=true;st.saved=id;renderCheck();window.scrollTo(0,0)
}
function reset(){st.z=[];st.s=[];st.c=[];st.i=3;st.step=0;st.done=false;renderCheck();window.scrollTo(0,0)}
function init(){
  load();
  $('stage').addEventListener('click',function(ev){
    var z=ev.target.closest('.zone');if(z){toggle('z',z.dataset.z);return}
    var c=ev.target.closest('[data-t]');if(c){toggle(c.dataset.t,c.dataset.k);return}
    var a=ev.target.closest('[data-a]');if(!a)return;var x=a.dataset.a;
    if(x==='next'){st.step++;renderCheck();window.scrollTo(0,0)}
    else if(x==='back'){st.step--;st.done=false;renderCheck();window.scrollTo(0,0)}
    else if(x==='again')reset();
    else if(x==='fit')fit(a.dataset.e);
    else if(x==='example'){st.z=['head'];st.s=['pull','pressure'];st.c=['demand','money'];st.i=3;st.step=4;renderCheck();window.scrollTo(0,0)}
  });
  $('stage').addEventListener('keydown',function(ev){var z=ev.target.closest&&ev.target.closest('.zone');if(z&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();toggle('z',z.dataset.z);var n=document.querySelector('.zone[data-z="'+z.dataset.z+'"]');if(n)n.focus()}});
  $('tabbar').addEventListener('click',function(ev){var b=ev.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
  show('check');
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
}
init();
})();
</script>
</body></html>
