<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#12100d">
<title>Secure payment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#12100d;--card:#1b1814;--card2:#26211a;--line:#3a332a;--fg:#f1ebdf;--muted:#aaa190;--gold:#d4a24a;--gold2:#f0c46a;--ink:#1a1405;--bad:#ef8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 400px at 50% -100px,rgba(212,162,74,.18),transparent 70%),var(--bg);color:var(--fg);font:16px/1.55 'Figtree',system-ui,sans-serif;display:grid;place-items:start center;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
.wrap{width:100%;max-width:460px;margin-top:4vh}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--muted);font-size:14px}
.dot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold))}
.card{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:24px 20px}
h1{font:600 26px/1.2 'Fraunces',Georgia,serif;margin:0 0 8px;text-wrap:balance}
.desc{color:var(--muted);margin:0 0 16px;white-space:pre-line}
.price{font:600 34px 'Fraunces',Georgia,serif;color:var(--gold2);margin:4px 0 18px}
.price small{font:500 13px 'Figtree',sans-serif;color:var(--muted);margin-left:6px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;font:16px 'Figtree',sans-serif;color:var(--fg);background:#14110d;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.btn{width:100%;margin-top:20px;min-height:52px;border:0;border-radius:14px;background:var(--gold);color:var(--ink);font:600 17px 'Figtree',sans-serif;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);margin:12px 0 0;min-height:1.4em;font-size:14.5px}
.safe{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--muted);font-size:13px;margin-top:16px}
.ok{text-align:center;padding:10px 0}
.ok svg{margin-bottom:6px}
.ok h1{margin-bottom:6px}
.msg{text-align:center;color:var(--muted);padding:12px 0}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><span id="brand"></span></div>
  <div class="card" id="card"><p class="msg">Loading…</p></div>
</div>
<script src="config.js"></script>
<script>
(function(){
var C=window.PAYHUB,$=function(i){return document.getElementById(i)};
$('brand').textContent=C.brand||'';
var page=null,card=$('card');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(p){return '₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2})}
function slug(){var q=new URLSearchParams(location.search).get('p');if(q)return q.toLowerCase();var m=location.pathname.match(/\/p\/([^\/]+)/);return m?decodeURIComponent(m[1]).toLowerCase():''}
function say(h){card.innerHTML=h}
var ERR={name_required:'Please enter your name.',email_invalid:'Please check your email address.',phone_invalid:'Please check your phone number.',amount_too_low:'That amount is below the minimum.',amount_too_high:'That amount is too high.',page_not_found:'This payment page is not available any more.',payments_not_configured:'Payments are not switched on yet. Please try again later.',razorpay:'The payment service did not respond. Please try again.',db:'Something went wrong on our side. Please try again.'};
function load(){
  var s=slug();
  if(!s){say('<p class="msg">This payment link is incomplete.</p>');return}
  fetch(C.supabaseUrl+'/rest/v1/rpc/ph_public_page',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey,Authorization:'Bearer '+C.anonKey},body:JSON.stringify({p_slug:s})})
  .then(function(r){return r.ok?r.json():null}).then(function(p){
    if(!p){say('<p class="msg">This payment page is not available.</p>');return}
    page=p;document.title=p.title+' · Secure payment';render()
  }).catch(function(){say('<p class="msg">Could not load this page. Check your internet and try again.</p>')})
}
function render(){
  var p=page,h='<h1>'+esc(p.title)+'</h1>'+(p.description?'<p class="desc">'+esc(p.description)+'</p>':'');
  if(p.pay_what_you_want){h+='<label for="amt">Amount (₹)</label><input id="amt" inputmode="decimal" placeholder="Minimum '+(p.min_paise/100)+'" autocomplete="off">'}
  else{h+='<div class="price">'+inr(p.amount_paise)+'<small>one-time</small></div>'}
  h+='<form id="f" novalidate><label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="80" required>'+
     '<label for="em">Email (for your receipt)</label><input id="em" type="email" autocomplete="email" maxlength="120" required>'+
     (p.collect_phone?'<label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel" maxlength="20">':'')+
     (p.collect_note?'<label for="nt">Note (optional)</label><textarea id="nt" rows="3" maxlength="300"></textarea>':'')+
     '<input class="hp" id="web" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">'+
     '<button class="btn" id="go" type="submit">'+esc(p.button_text)+(p.pay_what_you_want?'':' · '+inr(p.amount_paise))+'</button><p class="err" id="err" role="alert"></p></form>'+
     '<div class="safe">Secure payment by Razorpay · UPI, cards, netbanking</div>';
  say(h);$('f').addEventListener('submit',submit)
}
function fail(m){$('err').textContent=m;$('go').disabled=false}
function submit(ev){
  ev.preventDefault();$('err').textContent='';
  var body={slug:page.slug,name:$('nm').value,email:$('em').value,phone:$('ph')?$('ph').value:'',note:$('nt')?$('nt').value:'',website:$('web').value};
  if(!body.name.trim())return fail(ERR.name_required);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email.trim()))return fail(ERR.email_invalid);
  if(page.pay_what_you_want){var a=parseFloat(String($('amt').value).replace(/,/g,''));if(!isFinite(a)||a*100<page.min_paise)return fail('Please enter at least '+inr(page.min_paise)+'.');body.amount_paise=Math.round(a*100)}
  $('go').disabled=true;$('go').textContent='Please wait…';
  fetch(C.supabaseUrl+'/functions/v1/ph-order',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(x){if(!x.ok){$('go').textContent=page.button_text;return fail(ERR[x.j.error]||'Something went wrong. Please try again.')}openCheckout(x.j)})
  .catch(function(){$('go').textContent=page.button_text;fail('No internet connection. Please try again.')})
}
function loadRzp(cb){
  if(window.Razorpay)return cb();
  var s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=cb;s.onerror=function(){$('go').textContent=page.button_text;fail('Could not load the payment window. Check your internet.')};document.head.appendChild(s)
}
function openCheckout(o){
  loadRzp(function(){
    var rz=new window.Razorpay({key:o.key_id,amount:o.amount,currency:o.currency,order_id:o.order_id,name:C.brand||o.title,description:o.title,prefill:o.prefill,theme:{color:'#d4a24a'},
      handler:function(res){verify(res)},
      modal:{ondismiss:function(){$('go').disabled=false;$('go').textContent=page.button_text}}});
    rz.on('payment.failed',function(){$('err').textContent='The payment did not go through. You can try again.'});
    rz.open()
  })
}
function verify(res){
  say('<p class="msg">Confirming your payment…</p>');
  fetch(C.supabaseUrl+'/functions/v1/ph-verify',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey},body:JSON.stringify(res)})
  .then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){
      say('<div class="ok"><svg width="64" height="64" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="none" stroke="#d4a24a" stroke-width="2.5"/><path d="M16 28l8 8 14-17" fill="none" stroke="#d4a24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Payment received</h1><p class="desc">'+esc(j.success_message)+'</p><p class="msg">Payment ID: '+esc(res.razorpay_payment_id)+'</p></div>');
      if(j.redirect_url&&/^https:\/\//.test(j.redirect_url))setTimeout(function(){location.href=j.redirect_url},3000)
    }else say('<p class="msg">We could not confirm your payment yet. If money was taken, it will be confirmed automatically within a few minutes. Payment ID: '+esc(res.razorpay_payment_id)+'</p>')
  }).catch(function(){say('<p class="msg">We could not confirm your payment yet. If money was taken, it will be confirmed automatically. Payment ID: '+esc(res.razorpay_payment_id)+'</p>')})
}
load()
})();
</script>
</body></html>
